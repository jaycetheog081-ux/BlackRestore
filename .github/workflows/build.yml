name: Build BlackRestore IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Application
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml

      - name: Build BlackRestore
        run: |
          set -euo pipefail

          xcodebuild \
            -project BlackRestore.xcodeproj \
            -scheme BlackRestore \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/BlackRestore.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Build failed: BlackRestore.app was not found."
            exit 1
          fi

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/BlackRestore.app

          cd build/ipa
          zip -r ../../BlackRestore.ipa Payload
          cd ../..

          test -f BlackRestore.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackRestore-unsigned-IPA
          path: BlackRestore.ipa
          if-no-files-found: error
          retention-days: 14
